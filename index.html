<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7657f6">
<title>NIM SPERTO — Your social world</title>

<style>
:root {
  --purple: #7657f6;
  --purple-dark: #5c3bd4;
  --pink: #ff5ca8;
  --ink: #251d38;
  --muted: #7b718d;
  --line: #e8e1f2;
  --bg: #f5f3fa;
  --card: #fff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

.topbar {
  height: 68px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 900;
  font-size: 21px;
  color: var(--ink);
  white-space: nowrap;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 37px;
  height: 37px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color: white;
}

.searchbox {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #f3f0fa;
  border-radius: 999px;
  padding: 0 14px;
  height: 42px;
  max-width: 300px;
  flex: 1;
}

.searchbox input {
  border: 0;
  background: transparent;
  outline: none;
  width: 100%;
  min-width: 0;
}

.topnav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex: 1;
}

.navbtn {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px 14px;
  border-radius: 12px;
  font-weight: 700;
}

.navbtn.active,
.navbtn:hover {
  background: #f1ecff;
  color: var(--purple);
}

.top-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.roundbtn {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #f3f0fa;
  color: var(--ink);
}

.avatar {
  width: 40px;
  height: 40px;
  flex: 0 0 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #e9ddff, #ffdce9);
  color: #6245d8;
  font-weight: 850;
}

.layout {
  max-width: 1320px;
  margin: 22px auto;
  padding: 0 18px;
  display: grid;
  grid-template-columns: 240px minmax(0, 650px) 280px;
  gap: 22px;
  align-items: start;
}

.sidebar, .rightbar {
  position: sticky;
  top: 90px;
  display: grid;
  gap: 12px;
}

.sidecard, .card {
  background: var(--card);
  border: 1px solid #eee9f6;
  border-radius: 18px;
  box-shadow: 0 4px 18px #38225d06;
}

.sidecard { padding: 14px; }

.side-link {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  border: 0;
  background: transparent;
  padding: 12px;
  border-radius: 12px;
  text-align: left;
  color: var(--ink);
  font-weight: 700;
}

.side-link:hover,
.side-link.active {
  background: #f3efff;
  color: var(--purple);
}

.side-icon {
  width: 28px;
  text-align: center;
  font-size: 19px;
}

.small-muted {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.main {
  min-width: 0;
  display: grid;
  gap: 16px;
}

.welcome {
  padding: 20px;
  background: linear-gradient(120deg, #7657f6, #9a58e7 60%, #ff5ca8);
  color: white;
  border-radius: 18px;
}

.welcome h1 {
  font-size: 24px;
  margin: 0 0 5px;
}

.welcome p {
  margin: 0;
  color: #ffffffdf;
  font-size: 14px;
  line-height: 1.5;
}

.card { padding: 16px; }

.composer-head {
  display: flex;
  align-items: center;
  gap: 11px;
}

.composer textarea {
  display: block;
  width: 100%;
  min-height: 88px;
  resize: vertical;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 13px;
  margin-top: 13px;
  background: #fdfcff;
  color: var(--ink);
}

.composer-tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.toolset {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.toolbtn {
  border: 0;
  background: #f5f1fc;
  color: #6042ca;
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 750;
}

.primary {
  border: 0;
  background: linear-gradient(90deg, var(--purple), var(--pink));
  color: #fff;
  padding: 11px 17px;
  border-radius: 11px;
  font-weight: 800;
}

.status {
  font-size: 13px;
  color: var(--purple-dark);
  min-height: 18px;
  margin: 8px 0 0;
  overflow-wrap: anywhere;
}

.post { padding: 17px; }

.post-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-user { font-weight: 800; }

.post-time {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}

.post-content {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.65;
  margin: 15px 0;
}

.post-actions {
  display: flex;
  gap: 6px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.actionbtn {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 10px 5px;
  border-radius: 10px;
  font-weight: 750;
}

.actionbtn:hover,
.actionbtn.liked {
  background: #f4efff;
  color: var(--purple);
}

.comments {
  border-top: 1px solid var(--line);
  margin-top: 10px;
  padding-top: 12px;
}

.comment-line {
  padding: 8px 10px;
  background: #f7f5fb;
  border-radius: 11px;
  margin: 7px 0;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.comment-form {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.comment-form input {
  min-width: 0;
  flex: 1;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 10px 13px;
}

.comment-form button {
  border: 0;
  background: var(--purple);
  color: white;
  border-radius: 999px;
  padding: 9px 13px;
  font-weight: 750;
}

.right-title { font-size: 15px; margin: 2px 0 12px; }

.trend {
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.trend strong {
  font-size: 13px;
  display: block;
}

.trend span {
  font-size: 12px;
  color: var(--muted);
}

.profile-box {
  display: flex;
  align-items: center;
  gap: 11px;
  margin-bottom: 10px;
}

.profile-box strong {
  display: block;
  font-size: 14px;
}

.profile-box span {
  font-size: 12px;
  color: var(--muted);
}

.section-title { margin: 0; font-size: 22px; }

.section-intro {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

/* Login screen */
.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 22px;
  background: radial-gradient(circle at 15% 10%, #f4ddff 0, transparent 30%),
              radial-gradient(circle at 90% 80%, #ffe0ed 0, transparent 30%),
              var(--bg);
}

.auth-wrap {
  width: min(100%, 980px);
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #fff;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 24px 90px #44307018;
}

.hero {
  padding: clamp(28px, 5vw, 58px);
  background: linear-gradient(145deg, #7151ef, #9b4fe3 52%, #ff5ca8);
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 560px;
  position: relative;
  overflow: hidden;
}

.hero-copy { position: relative; z-index: 1; }

.hero h1 {
  font-size: clamp(36px, 5vw, 54px);
  line-height: 1.02;
  margin: 0 0 18px;
}

.hero p {
  line-height: 1.7;
  color: #ffffffdf;
  max-width: 340px;
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  position: relative;
  z-index: 1;
}

.chips span {
  border: 1px solid #ffffff55;
  background: #ffffff17;
  padding: 8px 12px;
  border-radius: 999px;
  font-size: 12px;
}

.formside {
  padding: clamp(25px, 5vw, 54px);
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.formside h2 { font-size: 27px; margin: 0 0 8px; }

.sub {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin: 0 0 25px;
}

.tabs {
  display: flex;
  gap: 5px;
  padding: 5px;
  background: #f4f0fb;
  border-radius: 13px;
  margin-bottom: 22px;
}

.tabs button {
  flex: 1;
  border: 0;
  background: transparent;
  padding: 11px;
  border-radius: 10px;
  font-weight: 750;
  color: var(--muted);
}

.tabs button.active {
  background: #fff;
  color: var(--purple);
}

.formside label {
  display: block;
  font-size: 13px;
  font-weight: 750;
  margin: 14px 0 7px;
}

.formside input {
  display: block;
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
}

.formside .primary { width: 100%; margin-top: 20px; }

.google {
  width: 100%;
  background: white;
  color: var(--ink);
  border: 1px solid var(--line);
  margin-top: 12px;
  padding: 13px;
  border-radius: 12px;
  font-weight: 800;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #a198b0;
  font-size: 12px;
  margin: 18px 0;
}

.divider:before, .divider:after {
  content: "";
  height: 1px;
  background: var(--line);
  flex: 1;
}

.note {
  font-size: 11px;
  color: #9389a4;
  line-height: 1.6;
  margin-top: 20px;
}

.feedback {
  font-size: 13px;
  line-height: 1.5;
  margin-top: 14px;
  color: #6042ca;
  overflow-wrap: anywhere;
}

.profile-edit { display: grid; gap: 10px; }
.profile-edit input { margin: 0; }
.profile-edit .primary { margin-top: 0; }

.mobile-nav { display: none; }

@media(max-width:1050px) {
  .layout { grid-template-columns: 205px minmax(0,1fr); }
  .rightbar { display: none; }
}

@media(max-width:720px) {
  .topbar { height: 60px; padding: 0 12px; gap: 10px; }
  .brand { font-size: 18px; }
  .brand-mark { width: 34px; height: 34px; }
  .topnav { display: none; }
  .top-actions .roundbtn { display: none; }
  .layout { display: block; margin: 12px auto; padding: 0 10px; }
  .sidebar, .rightbar { display: none; }
  .main { gap: 12px; }
  .welcome { padding: 17px; }
  .welcome h1 { font-size: 22px; }
  .card { padding: 13px; border-radius: 15px; }
  .post { padding: 14px; }
  .mobile-nav {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: #fff;
    border-top: 1px solid var(--line);
    padding: 6px 4px;
    justify-content: space-around;
  }
  .mobile-nav button {
    display: grid;
    gap: 2px;
    justify-items: center;
    flex: 1;
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    padding: 5px 0;
  }
  .mobile-nav button span:first-child { font-size: 20px; }
  .mobile-nav button.active { color: var(--purple); }
  body.has-session { padding-bottom: 68px; }
  .auth-shell { padding: 12px; }
  .auth-wrap { grid-template-columns: 1fr; border-radius: 22px; }
  .hero { min-height: 260px; padding: 24px; }
  .hero h1 { font-size: 38px; }
  .hero-copy { margin: 28px 0 18px; }
  .chips { display: none; }
  .formside { padding: 24px; }
}
</style>
</head>
<body>
