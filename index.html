
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIM SPERTO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #1c1e21;
    }
    header {
      background: #1877f2;
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 25px; }
    header input {
      padding: 10px;
      border: 0;
      border-radius: 20px;
      max-width: 280px;
      width: 100%;
    }
    nav {
      background: white;
      padding: 12px;
      display: flex;
      justify-content: center;
      gap: 22px;
      flex-wrap: wrap;
      border-bottom: 1px solid #ddd;
    }
    nav a {
      color: #1877f2;
      text-decoration: none;
      font-weight: bold;
    }
    main {
      max-width: 900px;
      margin: 25px auto;
      padding: 0 15px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 1px 3px #00000012;
    }
    .welcome { text-align: center; }
    .welcome h2 { color: #1877f2; }
    button {
      background: #1877f2;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 11px 18px;
      font-weight: bold;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
      margin-bottom: 12px;
      resize: vertical;
    }
    .muted { color: #65676b; }
    footer {
      text-align: center;
      padding: 25px;
      color: #65676b;
    }
  </style>
</head>
<body>
  <header>
    <h1>NIM SPERTO</h1>
    <input id="search" type="search" placeholder="Search NIM SPERTO">
  </header>

  <nav>
    <a href="#home">Home</a>
    <a href="#friends">Friends</a>
    <a href="#messages">Messages</a>
    <a href="#profile">Profile</a>
  </nav>

  <main id="home">
    <section class="card welcome">
      <h2>Welcome to NIM SPERTO!</h2>
      <p>Your community. Your connections. Your space.</p>
      <p class="muted">Your new social network starts here.</p>
    </section>

    <section class="card">
      <h3>Create a post</h3>
      <textarea id="postText" placeholder="What's on your mind?"></textarea>
      <button id="publish">Publish post</button>
      <p id="status" class="muted" aria-live="polite"></p>
    </section>

    <section id="feed">
      <article class="card">
        <h3>NIM SPERTO</h3>
        <p>Welcome! This is where your community feed will appear.</p>
        <p class="muted">Starter post</p>
      </article>
    </section>
  </main>

  <footer>© 2026 NIM SPERTO</footer>

  <script>
    const publish = document.getElementById("publish");
    const postText = document.getElementById("postText");
    const feed = document.getElementById("feed");
    const status = document.getElementById("status");

    publish.addEventListener("click", function () {
      const text = postText.value.trim();

      if (!text) {
        status.textContent = "Write something first.";
        return;
      }

      const card = document.createElement("article");
      card.className = "card";

      const heading = document.createElement("h3");
      heading.textContent = "Your post";

      const content = document.createElement("p");
      content.textContent = text;

      card.append(heading, content);
      feed.prepend(card);

      postText.value = "";
      status.textContent = "Post added to this page!";
    });
  </script>

</body>
</html>
